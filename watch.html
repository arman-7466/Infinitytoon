<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="InfinityToons">
    <link rel="apple-touch-icon" href="images/ios-icon.png">
    <link rel="manifest" href="/manifest.json">
    
    <title>Infinitytoonshub - Watch</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=6">

    <style>
        /* Pure Glass Liquid Spatial UI Styles */
        .watch-hero-container {
            position: relative;
            width: 92%;
            max-width: 1350px;
            margin: 30px auto;
            min-height: 70vh;
            border-radius: 30px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.2);
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }

        @media screen and (max-width: 1024px) {
            .watch-hero-container { grid-template-columns: 1fr; height: auto; }
        }

        .watch-main-content {
            position: relative;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            z-index: 2;
        }

        .watch-main-content::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, #0b0714 15%, rgba(11,7,20,0.7) 50%, transparent 100%);
            z-index: -1;
        }

        .season-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 15px;
            width: fit-content;
        }

        .anime-main-title {
            font-size: 3.2rem;
            font-weight: 900;
            color: #ffffff;
            line-height: 1.1;
            margin-bottom: 15px;
            letter-spacing: -1px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }

        .anime-description {
            font-size: 1rem;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.7);
            max-width: 650px;
            margin-bottom: 20px;
        }

        .rating-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .imdb-badge {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            color: #fff;
            font-weight: 800;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .rating-text {
            font-size: 1.3rem;
            font-weight: 800;
            color: #fff;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* Pure Liquid Glass Buttons */
        .btn-watch-primary {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.4);
            transition: 0.3s;
            text-decoration: none;
        }
        .btn-watch-primary:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .btn-add-list {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }
        .btn-add-list:hover { background: rgba(255, 255, 255, 0.15); }

        /* Right Side Episodes Sidebar (Glass Panel) */
        .episodes-sidebar {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 70vh;
            overflow-y: auto;
        }
        .sidebar-title {
            font-size: 1.1rem; font-weight: 700; color: #fff;
            display: flex; align-items: center; gap: 8px; margin-bottom: 5px;
        }
        .ep-side-card {
            display: flex; align-items: center; gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px; padding: 8px; text-decoration: none; transition: 0.3s;
        }
        .ep-side-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateX(4px);
        }
        .ep-side-card.active-ep {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.3);
        }
        .ep-thumb-box {
            width: 90px; height: 55px; border-radius: 10px; overflow: hidden; position: relative; flex-shrink: 0; background: #111;
        }
        .ep-thumb-box img { width: 100%; height: 100%; object-fit: cover; }
        .ep-info-box h4 { font-size: 0.85rem; color: #fff; font-weight: 600; margin-bottom: 3px; }
        .ep-info-box span { font-size: 0.7rem; color: rgba(255,255,255,0.6); }

        /* Transparent Liquid Glass Video Player Container */
        .player-drop-container {
            max-width: 1350px;
            width: 92%;
            margin: 0 auto 3rem;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 40px 80px rgba(0,0,0,0.85), inset 0 1px 2px rgba(255,255,255,0.2);
        }
        .player-wrapper {
            position: relative; width: 100%; background: #000; aspect-ratio: 16/9;
        }
        .player-wrapper iframe { width: 100%; height: 100%; border: none; }
        .player-controls-bar {
            padding: 20px 25px;
            background: rgba(10, 5, 18, 0.85);
            backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .server-btn {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
            color: white; padding: 8px 18px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; transition: 0.3s;
        }
        .server-btn.active {
            background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.4);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>

    <!-- Cinematic Dynamic Background -->
    <div id="pageBackground" class="hero-background"></div>

    <!-- Spatial Glass Navbar -->
    <nav class="anime-navbar">
        <div class="nav-left">
            <a href="index.html" class="logo">
                <div class="logo-icon">呪</div>
                <span class="logo-text">Infinitytoonshub</span>
            </a>
            <div class="nav-links">
                <a href="index.html"><i class="fas fa-compass"></i> Browse</a>
                <a href="series.html"><i class="fas fa-star"></i> Series</a>
                <a href="movies.html"><i class="fas fa-film"></i> Movies</a>
            </div>
        </div>
        <div class="nav-right">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="animeSearch" placeholder="Search...">
            </div>
            <div class="user-profile">
                <span>Rengoku</span>
                <div class="avatar">炎</div>
            </div>
        </div>
    </nav>

    <!-- STREAMING HERO SECTION (Transparent Glass) -->
    <div class="watch-hero-container">
        <div class="watch-main-content">
            <div class="season-badge">FEATURED COLLECTION</div>
            <h1 class="anime-main-title" id="animeNameText">Loading...</h1>
            <p class="anime-description" id="animeDescText">Experience high-definition spatial anime streaming. Select an episode from the right sidebar and enjoy smooth playback.</p>
            
            <div class="rating-box">
                <span class="imdb-badge">RATING</span>
                <span class="rating-text" id="imdbRatingText">9.4/10</span>
            </div>

            <div class="action-buttons">
                <button class="btn-watch-primary" onclick="scrollToPlayer()">
                    <i class="fas fa-play"></i> Stream Now
                </button>
                <button class="btn-add-list" onclick="alert('Added to watchlist!')">
                    <i class="fas fa-plus"></i> Watchlist
                </button>
            </div>
        </div>

        <!-- Right Side Stacked Episodes Sidebar -->
        <div class="episodes-sidebar" id="episodeTray">
            <div class="sidebar-title"><i class="fas fa-list-ul" style="color: rgba(255,255,255,0.8);"></i> Episodes</div>
            <!-- Dynamic cards injected here -->
        </div>
    </div>

    <!-- TRANSPARENT LIQUID GLASS VIDEO PLAYER -->
    <div class="player-drop-container" id="playerSection">
        <div class="player-wrapper">
            <iframe id="vidPlayer" src="" allowfullscreen></iframe>
        </div>
        <div class="player-controls-bar">
            <div>
                <h3 id="vidTitle" style="color: white; font-size: 1.1rem; font-weight: 700;">Episode Player</h3>
            </div>
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <div style="display: flex; gap: 6px;">
                    <button id="srv1Btn" onclick="switchServer('server1')" class="server-btn active">Server 1</button>
                    <button id="srv2Btn" onclick="switchServer('server2')" class="server-btn">Server 2</button>
                </div>
                <button id="nextEpBtn" style="display:none; background: rgba(255,255,255,0.2); backdrop-filter:blur(10px); color:white; border:1px solid rgba(255,255,255,0.4); padding: 8px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.85rem;">
                    Next <i class="fas fa-forward"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Apple Vision / Liquid Glass Floating Mobile Bottom Navigation -->
    <div class="mobile-bottom-nav">
        <a href="index.html"><i class="fas fa-home"></i> Home</a>
        <a href="series.html"><i class="fas fa-tv"></i> Series</a>
        <a href="movies.html"><i class="fas fa-film"></i> Movies</a>
        <a href="new.html"><i class="fas fa-fire"></i> New</a>
        <a href="contact.html"><i class="fas fa-folder-open"></i> Files</a>
    </div>

    <script src="script.js"></script>
    <script>
        function scrollToPlayer() {
            const playerBox = document.getElementById("playerSection");
            playerBox.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
    <script src="bg-loader.js"></script>
</body>
</html>
