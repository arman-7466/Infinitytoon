<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Anime | Infinitytoonshub</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="style.css?v=5">

<style>
.ambient-glow {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:75vw; height:75vh;
  background:radial-gradient(circle,rgba(123,44,191,.4),rgba(0,210,255,.15) 50%,transparent 75%);
  filter:blur(110px); z-index:-1;
}
.player-container {
  max-width:950px; width:calc(100% - 24px); margin:1.5rem auto;
  border-radius:16px; overflow:hidden; background:#000;
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 25px 60px rgba(0,0,0,.9);
}
#vidPlayer {
  display:block; width:100%; aspect-ratio:16/9; height:auto;
  min-height:220px; border:0; background:#000;
}
.player-title-box {
  padding:18px 25px; display:flex; justify-content:space-between;
  align-items:center; flex-wrap:wrap; gap:15px;
  background:linear-gradient(to right,rgba(20,10,35,.95),rgba(10,5,15,.95));
}
.vibe-btn {
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
  color:white; padding:7px 14px; border-radius:20px; cursor:pointer;
}
.vibe-btn.active { background:linear-gradient(135deg,#a66bff,#6240b0); }
.episode-selector-section { max-width:950px; margin:2rem auto 3rem; padding:0 1rem; }
.episode-grid-tray {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:12px; max-height:300px; overflow-y:auto; padding:12px;
  background:rgba(14,8,24,.6); border-radius:14px;
}
.ep-tray-card {
  background:rgba(25,18,42,.7); border:1px solid rgba(166,107,255,.2);
  border-radius:10px; padding:12px; text-align:center;
  color:white; text-decoration:none; font-size:.85rem;
}
.ep-tray-card.active-ep { background:linear-gradient(135deg,#a66bff,#6240b0); }
@media(max-width:520px) {
  #vidPlayer { min-height:190px; }
  .player-title-box { padding:12px; }
}
</style>
</head>
<body>

<div id="pageBackground" class="hero-background"></div>
<div class="ambient-glow"></div>

<nav class="anime-navbar">
  <div class="nav-left">
    <a href="index.html" class="logo"><div class="logo-icon">呪</div><span class="logo-text">Infinitytoonshub</span></a>
    <div class="nav-links"><a href="javascript:history.back()"><i class="fas fa-arrow-left"></i> Go Back</a></div>
  </div>
</nav>

<div class="hero-banner" style="height:50vh">
  <video autoplay loop muted playsinline class="hero-video" id="heroVideo">
    <source src="videos/animeclip (17).mp4" type="video/mp4" id="heroVideoSource">
  </video>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <span>SEASON 01 COLLECTION</span>
    <h1 id="pageTitle">NOW STREAMING IN HD</h1>
    <p>Choose an episode and available server.</p>
  </div>
</div>

<div class="hero-message" style="text-align:center">
  <span id="animeNameText">Loading...</span>
  <span id="epNumText"></span>
</div>

<div class="player-container">
  <iframe id="vidPlayer" src="" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>
  <div class="player-title-box">
    <h2 id="vidTitle">Loading Episode...</h2>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div style="display:flex;gap:5px">
        <button id="srv1Btn" onclick="switchServer('server1')" class="vibe-btn active">Server 1</button>
        <button id="srv2Btn" onclick="switchServer('server2')" class="vibe-btn">Server 2</button>
      </div>
      <button id="nextEpBtn" style="display:none">Next Ep <i class="fas fa-forward"></i></button>
    </div>
  </div>
</div>

<div class="episode-selector-section">
  <h3> <i class="fas fa-list-ul"></i> All Episodes</h3>
  <div class="episode-grid-tray" id="episodeTray"></div>
</div>

<script src="script.js?v=10"></script>
<script src="infinitytoons-enhancements.js"></script>
<script src="background-video-rotator.js"></script>
  <!-- JioHotstar Style Mobile Bottom Navigation -->
<div class="mobile-bottom-nav">
    <a href="index.html" class="active"><i class="fas fa-home"></i> Home</a>
    <a href="series.html"><i class="fas fa-tv"></i> Series</a>
    <a href="movies.html"><i class="fas fa-film"></i> Movies</a>
    <a href="new.html"><i class="fas fa-fire"></i> New Anime</a>
    <a href="contact.html"><i class="fas fa-folder-open"></i> Files</a>
</div>
</body>
</html>
