<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="InfinityToons">
    <link rel="apple-touch-icon" href="images/ios-icon.png">
    <link rel="manifest" href="/manifest.json">
    
    <title>Infinitytoonshub - Watch</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=6">

  
    <style>
    /* Sabhi pages par background fix karne ke liye master override */
    body {
        background-color: transparent !important;
        position: relative;
    }
    #bg-container {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        z-index: -999 !important;
        background-size: cover !important;
        background-position: center !important;
        filter: blur(8px) brightness(0.7) saturate(1.2) !important;
        transform: scale(1.05) !important;
    }
</style>
</head>
<body>

    <!-- Cinematic Dynamic Background -->
    <div id="pageBackground" class="hero-background"></div>

    <!-- Spatial Glass Navbar -->
    <nav class="anime-navbar">
        <div class="nav-left">
            <a href="index.html" class="logo">
                <div class="logo-icon">呪</div>
                <span class="logo-text">Infinitytoonshub</span>
            </a>
            <div class="nav-links">
                <a href="index.html"><i class="fas fa-compass"></i> Browse</a>
                <a href="series.html"><i class="fas fa-star"></i> Series</a>
                <a href="movies.html"><i class="fas fa-film"></i> Movies</a>
            </div>
        </div>
        <div class="nav-right">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="animeSearch" placeholder="Search...">
            </div>
            <div class="user-profile">
                <span>Rengoku</span>
                <div class="avatar">炎</div>
            </div>
        </div>
    </nav>

    <!-- STREAMING HERO SECTION (Transparent Glass) -->
    <div class="watch-hero-container">
        <div class="watch-main-content">
            <div class="season-badge">FEATURED COLLECTION</div>
            <h1 class="anime-main-title" id="animeNameText">Loading...</h1>
            <p class="anime-description" id="animeDescText">Experience high-definition spatial anime streaming. Select an episode from the right sidebar and enjoy smooth playback.</p>
            
            <div class="rating-box">
                <span class="imdb-badge">RATING</span>
                <span class="rating-text" id="imdbRatingText">9.4/10</span>
            </div>

            <div class="action-buttons">
                <button class="btn-watch-primary" onclick="scrollToPlayer()">
                    <i class="fas fa-play"></i> Stream Now
                </button>
                <button class="btn-add-list" onclick="alert('Added to watchlist!')">
                    <i class="fas fa-plus"></i> Watchlist
                </button>
            </div>
        </div>

        <!-- Right Side Stacked Episodes Sidebar -->
        <div class="episodes-sidebar" id="episodeTray">
            <div class="sidebar-title"><i class="fas fa-list-ul" style="color: rgba(255,255,255,0.8);"></i> Episodes</div>
            <!-- Dynamic cards injected here -->
        </div>
    </div>

    <!-- TRANSPARENT LIQUID GLASS VIDEO PLAYER -->
    <div class="player-drop-container" id="playerSection">
        <div class="player-wrapper">
            <iframe id="vidPlayer" src="" allowfullscreen></iframe>
        </div>
        <div class="player-controls-bar">
            <div>
                <h3 id="vidTitle" style="color: white; font-size: 1.1rem; font-weight: 700;">Episode Player</h3>
            </div>
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <div style="display: flex; gap: 6px;">
                    <button id="srv1Btn" onclick="switchServer('server1')" class="server-btn active">Server 1</button>
                    <button id="srv2Btn" onclick="switchServer('server2')" class="server-btn">Server 2</button>
                </div>
                <button id="nextEpBtn" style="display:none; background: rgba(255,255,255,0.2); backdrop-filter:blur(10px); color:white; border:1px solid rgba(255,255,255,0.4); padding: 8px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.85rem;">
                    Next <i class="fas fa-forward"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Apple Vision / Liquid Glass Floating Mobile Bottom Navigation -->
    <div class="mobile-bottom-nav">
        <a href="index.html"><i class="fas fa-home"></i> Home</a>
        <a href="series.html"><i class="fas fa-tv"></i> Series</a>
        <a href="movies.html"><i class="fas fa-film"></i> Movies</a>
        <a href="new.html"><i class="fas fa-fire"></i> New</a>
        <a href="contact.html"><i class="fas fa-folder-open"></i> Files</a>
    </div>

    <script src="script.js"></script>
    <script>
        function scrollToPlayer() {
            const playerBox = document.getElementById("playerSection");
            playerBox.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
    <script src="bg-loader.js"></script>
</body>
</html>
