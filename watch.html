<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="InfinityToons">
    <link rel="apple-touch-icon" href="images/ios-icon.png">
    
    <title>Infinitytoonshub</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Yaha dhyan de: v=3 kar diya hai taki naya CSS load ho -->
    <link rel="stylesheet" href="style.css?v=3">

    <style>
        .ambient-glow {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 75vw; height: 75vh;
            background: radial-gradient(circle, rgba(123, 44, 191, 0.4) 0%, rgba(0, 210, 255, 0.15) 50%, transparent 75%);
            filter: blur(110px); z-index: -1;
        }
        .player-container {
            max-width: 950px; margin: 1.5rem auto; border-radius: 16px; overflow: hidden; background: #000;
            border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
            position: relative; z-index: 10;
        }
        .player-title-box {
            background: linear-gradient(to right, rgba(20, 10, 35, 0.95), rgba(10, 5, 15, 0.95));
            border-top: 1px solid rgba(255, 255, 255, 0.05); padding: 18px 25px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
        }
        .vibe-btn {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
            color: white; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; transition: 0.3s;
        }
        .vibe-btn:hover { background: rgba(255,255,255,0.2); }
        .vibe-btn.active { background: linear-gradient(135deg, #a66bff, #6240b0); border-color: white; }
        .episode-selector-section { max-width: 950px; margin: 2rem auto 3rem; padding: 0 1rem; }
        .episode-grid-tray {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px;
            max-height: 300px; overflow-y: auto; padding: 12px;
            background: rgba(14, 8, 24, 0.6); border: 1px solid rgba(166, 107, 255, 0.15); border-radius: 14px;
        }
        .ep-tray-card {
            background: rgba(25, 18, 42, 0.7); border: 1px solid rgba(166, 107, 255, 0.2);
            border-radius: 10px; padding: 12px; text-align: center; text-decoration: none;
            color: white; font-size: 0.85rem; font-weight: 600; transition: 0.3s; display: block;
        }
        .ep-tray-card:hover { background: rgba(123, 44, 191, 0.4); border-color: #00d2ff; }
        .ep-tray-card.active-ep { background: linear-gradient(135deg, #a66bff, #6240b0); border-color: white; }
    </style>
</head>
<body>
    <!-- Dynamic Background Image Container (Jo automatically anime ke hisaab se change hogi) -->
   <div id="pageBackground" class="hero-background"></div>
  

    <div class="ambient-glow"></div>

    <nav class="anime-navbar" style="background: rgba(5, 1, 7, 0.85);">
        <div class="nav-left">
            <a href="index.html" class="logo">
                <div class="logo-icon">呪</div>
                <span class="logo-text">Infinitytoonshub</span>
            </a>
            <div class="nav-links">
                <a href="javascript:history.back()"><i class="fas fa-arrow-left"></i> Go Back</a>
            </div>
        </div>
    </nav>
  <!-- Netflix Style Hero Video Banner -->
    <div class="hero-banner" style="height: 50vh;">
        <video autoplay loop muted playsinline class="hero-video" id="heroVideo">
            <source src="videos/animeclip (17).mp4" type="video/mp4" id="heroVideoSource">
        </video>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <span style="background: rgba(166,107,255,0.2); border:1px solid rgba(166,107,255,0.5); backdrop-filter:blur(10px); color: #c5a9ff; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 0.8rem; letter-spacing: 1px;">SEASON 01 COLLECTION</span>
            <h1 id="pageTitle" style="color: white; font-size: 3rem; margin: 10px 0; font-weight: 900;">NOW STREAMING IN HD</h1>
            <p style="color: #d1c4e9; font-size: 1rem;">Sit back, relax, and enjoy uninterrupted playback. Switch seamlessly between multiple servers for the best viewing experience without any lag.</p>
        </div>
    </div>
    <div class="hero-message" style="padding-bottom: 0; text-align: center;">
        <span id="animeNameText" style="color:#00d2ff; font-weight: 800; text-transform: uppercase;">Loading...</span> 
        <span id="epNumText" style="color: #a580e0; font-size: 1.1rem; margin-left: 10px;"></span>
    </div>

    <!-- PLAYER -->
    <div class="player-container">
        <iframe id="vidPlayer" width="100%" height="520px" src="" frameborder="0" allowfullscreen></iframe>
        <div class="player-title-box">
            <div>
                <h2 id="vidTitle" style="color: white; font-weight: 700; font-size: 1.3rem; margin:0;">Loading Episode...</h2>
            </div>
            
            <!-- SERVER SWITCHER & NEXT EPISODE -->
            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                <!-- Server Buttons -->
                <div style="display: flex; gap: 5px; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1);">
                    <button id="srv1Btn" onclick="switchServer('server1')" class="vibe-btn active" style="margin:0;">Server 1</button>
                    <button id="srv2Btn" onclick="switchServer('server2')" class="vibe-btn" style="margin:0;">Server 2</button>
                </div>

                <button id="nextEpBtn" style="display:none; background: linear-gradient(135deg, #a66bff, #6240b0); color:white; border:none; padding: 7px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.8rem;">
                    Next Ep <i class="fas fa-forward"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- NEECHE EPISODES LIST TRAY -->
    <div class="episode-selector-section">
        <h3 style="color: #f0ebff; font-size: 1.1rem; margin-bottom: 12px;"><i class="fas fa-list-ul" style="color: #a66bff;"></i> All Episodes</h3>
        <div class="episode-grid-tray" id="episodeTray"></div>
    </div>

  <script src="script.js"></script>
<script src="infinitytoons-enhancements.js"></script>
<script src="background-video-rotator.js"></script>
</body>
</html>
