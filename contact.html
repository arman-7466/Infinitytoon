<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="InfinityToons">
    <link rel="apple-touch-icon" href="images/ios-icon.png">
    
    <title>Infinitytoonshub</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Yaha dhyan de: v=3 kar diya hai taki naya CSS load ho -->
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <!-- Dynamic Background -->
    <div id="pageBackground" class="hero-background" style="background-image: url('images/Naruto.webp');"></div>

    <!-- Navbar -->
    <nav class="anime-navbar">
        <div class="nav-left">
            <a href="index.html" class="logo">
                <div class="logo-icon">呪</div>
                <span class="logo-text">Infinitytoonshub</span>
            </a>
            <div class="nav-links">
                <a href="index.html"><i class="fas fa-compass"></i> Browse</a>
                <a href="series.html"><i class="fas fa-star"></i> Anime Series</a>
                <a href="movies.html"><i class="fas fa-film"></i> Movies</a>
                <a href="about.html"><i class="fas fa-info-circle"></i> About Us</a>
                <a href="contact.html" class="active"><i class="fas fa-envelope"></i> Contact</a>
            </div>
        </div>
    </nav>

    <!-- Contact Box Section -->
    <div style="max-width: 750px; margin: 4rem auto; padding: 3rem; background: rgba(14, 8, 24, 0.7); backdrop-filter: blur(25px); border: 1px solid rgba(166, 107, 255, 0.2); border-radius: 24px; box-shadow: 0 30px 60px rgba(0,0,0,0.8);">
        <span style="color: #00d2ff; font-weight: 700; font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase;">GET IN TOUCH</span>
        <h1 style="color: white; font-size: 2.5rem; margin: 10px 0 15px; font-weight: 900;">Got Anime Requests?</h1>
        <p style="color: #d1c4e9; font-size: 1rem; margin-bottom: 30px;">
            Can't find your favorite series or movie on the platform? Drop us a message below, and we'll add it to the universe as soon as possible!
        </p>

       <form action="https://formspree.io/f/xwllppwe" method="POST" style="display: flex; flex-direction: column; gap: 20px;">
            <div>
                <label style="display: block; color: #cbadff; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px;">Your Name / Username</label>
                <input type="text" placeholder="e.g. Rengoku" required style="width: 100%; padding: 14px 18px; background: rgba(25, 18, 42, 0.8); border: 1px solid rgba(166, 107, 255, 0.25); border-radius: 12px; color: white; outline: none; font-size: 1rem;">
            </div>

            <div>
                <label style="display: block; color: #cbadff; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px;">Anime Title / Message</label>
                <textarea rows="4" placeholder="Which anime do you want us to add?" required style="width: 100%; padding: 14px 18px; background: rgba(25, 18, 42, 0.8); border: 1px solid rgba(166, 107, 255, 0.25); border-radius: 12px; color: white; outline: none; font-size: 1rem; resize: none;"></textarea>
            </div>

            <button type="submit" style="background: linear-gradient(135deg, #a66bff, #6240b0); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 25px rgba(123, 44, 191, 0.4);">
                Send Request <i class="fas fa-paper-plane" style="margin-left: 8px;"></i>
            </button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
